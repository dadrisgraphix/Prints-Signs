<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Dadris Prints and Signs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-900">DADRIS PRINTS & SIGNS</h1>
            <p class="text-sm text-gray-500 mt-1">Sign in to access your branch portal</p>
        </div>

        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="login-email" required class="w-full p-2.5 border rounded-lg border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="login-password" required class="w-full p-2.5 border rounded-lg border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit" id="btn-login" class="w-full bg-blue-900 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-800 transition">
                Sign In
            </button>
        </form>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.innerText = 'Signing in...';
            btn.disabled = true;

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            // 1. Authenticate with Supabase
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Login Failed: " + error.message);
                btn.innerText = 'Sign In';
                btn.disabled = false;
                return;
            }

            // 2. Fetch Profile details to route to the right branch & role
            const { data: profile, error: profileError } = await supabase
                .from('profiles')
                .select('*, branches(name)')
                .eq('id', data.user.id)
                .single();

            if (profileError || !profile) {
                alert("Profile configuration missing. Contact Admin.");
                btn.innerText = 'Sign In';
                btn.disabled = false;
                return;
            }

            // Store active session parameters
            localStorage.setItem('user_role', profile.role);
            localStorage.setItem('user_branch_id', profile.branch_id);
            localStorage.setItem('user_name', profile.full_name);

            // Redirect directly to Branch Dashboard
            window.location.href = 'branch.html';
        }
    </script>
</body>
</html>
