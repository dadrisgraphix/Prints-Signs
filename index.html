<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DADRIS PRINTS AND SIGNS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">DADRIS</h1>
            <p class="text-sm text-slate-500 tracking-widest font-semibold uppercase mt-1">Prints and Signs</p>
            <h2 class="text-lg font-medium text-slate-700 mt-6">Business Operating System</h2>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-700">Email Address</label>
               <input type="text" id="login-username" placeholder="Username or Email" class="..." required>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Password</label>
                <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div id="error-message" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-md"></div>

            <button type="submit" id="submitBtn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-900 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-900 transition-colors">
                Sign In
            </button>
        </form>
    </div>

    <!-- Load our scripts -->
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
